<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesture Web</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --custom: #bf5af2;
      --border: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #98989d;
        --accent: #0a84ff;
        --custom: #bf5af2;
        --border: #38383a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
    }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    h1 { grid-column: 1 / -1; margin: 0; font-size: 28px; font-weight: 700; }
    h1 small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }

    .stage {
      position: relative;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .loading {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: #fff; font-size: 16px; background: rgba(0,0,0,.6);
    }
    .overlay {
      position: absolute;
      transform: translate(-50%, -100%) scale(0);
      transition: transform .18s cubic-bezier(.3,1.6,.6,1), opacity .18s;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.45));
    }
    .overlay.show { transform: translate(-50%, -100%) scale(1); opacity: 1; }
    #nikeOverlay img { width: 220px; display: block; }
    #okOverlay { font-size: 140px; line-height: 1; }

    .panel { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    #gestureName { font-size: 30px; font-weight: 700; min-height: 38px; }
    #gestureName.custom { color: var(--custom); }
    #gestureSource { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .bar { margin: 8px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    .bar-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
    .bar.active .bar-fill { background: var(--custom); }
    label { font-size: 14px; display: block; margin-bottom: 6px; }
    select, input[type=range] { width: 100%; }
    select {
      font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .error { color: #ff453a; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Gesture Web<small>nike ✔︎ 를 하면 Nike 로고, ok 를 하면 👌</small></h1>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="nikeOverlay" class="overlay"><img src="nike.svg" alt="Nike"></div>
    <div id="okOverlay" class="overlay">👌</div>
    <div id="loading" class="loading">모델 불러오는 중...</div>
  </div>

  <div class="panel">
    <div class="card">
      <h2>현재 제스처</h2>
      <div id="gestureName">–</div>
      <div id="gestureSource">손을 카메라에 보여주세요</div>
    </div>
    <div class="card">
      <h2>커스텀 모델 확률</h2>
      <div id="bars"></div>
    </div>
    <div class="card">
      <h2>설정</h2>
      <label for="cameraSelect">카메라</label>
      <select id="cameraSelect"></select>
      <div style="height:12px"></div>
      <div class="row"><label for="threshold">확신도 기준</label><span id="thresholdValue">0.80</span></div>
      <input id="threshold" type="range" min="0.5" max="0.99" step="0.01" value="0.8">
      <div id="error" class="error"></div>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
